document:
  template_match:
    required: true
  format_check:
    font: true
    margin: true
    table: true

quality:
  minimum_score: 95
  weights:
    template: 30
    content: 25
    teaching: 25
    format: 20

repair:
  max_loops: 3

performance:
  cache_enabled: true
  incremental_repair: true
  skip_unchanged: true

compute:
  profiles:
    low:    {loops: 1, visual: false}
    medium: {loops: 2, visual: false}
    high:   {loops: 3, visual: true}
  default: auto

reflection:
  save_failure: true
  update_rule: true
